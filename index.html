<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Financiamento Imobiliário</title>
    <meta
      name="description"
      content="Minha Casa, Minha Vida e SBPE: faixa, taxa e parcela na hora, o imóvel máximo pela renda e a tabela de amortização."
    />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Prévia ao colar o link no WhatsApp, LinkedIn etc. (Open Graph).
      As URLs precisam ser absolutas: quem lê estas tags é o robô de cada rede,
      não o navegador. Se o domínio mudar, atualize og:url e og:image.
      Ao trocar a imagem, aumente o ?v=: o LinkedIn guarda a imagem antiga pela URL.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://simulador-financiamento-blush.vercel.app/" />
    <meta property="og:title" content="Simulador de Financiamento Imobiliário: MCMV e SBPE" />
    <meta
      property="og:description"
      content="Para corretores: faixa do Minha Casa, Minha Vida, taxa e parcela na hora, o imóvel máximo pela renda e o aviso quando a parcela não cabe."
    />
    <meta property="og:image" content="https://simulador-financiamento-blush.vercel.app/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exemplo de resultado: Minha Casa, Minha Vida, Faixa 3, 1ª parcela de R$ 1.543,82, usando 25,73% da renda" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
