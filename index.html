<html lang="pt-BR">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Financiamento Imobiliário</title>

    <!--
      Prévia ao colar o link no WhatsApp, LinkedIn etc. (Open Graph).
      As URLs precisam ser absolutas: quem lê estas tags é o robô de cada rede,
      não o navegador. Se o domínio mudar, atualize og:url e og:image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://simulador-financiamento-blush.vercel.app/" />
    <meta property="og:title" content="Simulador de Financiamento Imobiliário: SAC × PRICE" />
    <meta
      property="og:description"
      content="Compare as parcelas, veja a tabela de amortização e o quanto da renda fica comprometido."
    />
    <meta property="og:image" content="https://simulador-financiamento-blush.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gráfico do saldo devedor no SAC e na PRICE ao longo de 30 anos" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
